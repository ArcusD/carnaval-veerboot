<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Carnavalswagen Display</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="spacer"></div>
        <div id="titel">Eesjte Zittesje Vaerdeins</div>
        <div id="klok">--:--</div>
    </header>

    <main>
        <div id="volgende-tekst">Volgende sjtop:</div>
        <div id="huidige-halte">Laje...</div>
    </main>

    <footer>
        Deze vaerdeins wurt aangebaoje door CV Opnuuj Begoosj
    </footer>

    <div id="bier-overlay">
        <div id="bier-tekst-groot">HAAL<br>BIER</div>
        <div id="bier-naam-tekst">NAAM</div>
    </div>

    <script>
        // 1. KLOK (Elke seconde)
        function updateKlok() {
            const nu = new Date();
            document.getElementById('klok').innerText = nu.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateKlok, 1000);
        updateKlok();

        // 2. HALTE LADEN (Elke 3 seconden)
        async function updateDisplay() {
            try {
                // Haal de lijst op uit de Python backend
                const response = await fetch('/api/haltes');
                const haltes = await response.json();

                const halteVeld = document.getElementById('huidige-halte');
                const labelVeld = document.getElementById('volgende-tekst');

                // Pak de EERSTE uit de lijst (index 0)
                if (haltes.length > 0) {
                    halteVeld.innerText = haltes[0];
                    labelVeld.innerText = "Volgende sjtop:";
                } else {
                    // Lijst is leeg?
                    halteVeld.innerText = "EINDE";
                    labelVeld.innerText = "Tot volgend jaor!";
                }

            } catch (e) {
                console.error("Kon halte niet laden:", e);
            }
        }
        // Start direct en herhaal
        updateDisplay();
        setInterval(updateDisplay, 3000);

        // 3. BIER ALARM (Elke 2 seconden)
        async function checkBierStatus() {
            try {
                const response = await fetch('/api/bier_status');
                const data = await response.json();

                const overlay = document.getElementById('bier-overlay');
                const naamVeld = document.getElementById('bier-naam-tekst');

                if (data.bier_modus === true) {
                    overlay.style.display = 'flex';
                    naamVeld.innerText = data.bier_haalder;
                } else {
                    overlay.style.display = 'none';
                }
            } catch (e) {
                console.log("Kon bier status niet checken", e);
            }
        }
        setInterval(checkBierStatus, 2000);
    </script>

</body>
</html>
