<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eesjte Zittesje Vaerdeins</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=7">
</head>

<body class="carnaval">
    <header class="topbar">
        <div class="logo-container">
            <img class="header-logo" src="{{ url_for('static', filename='cv-logo.png') }}" alt="Logo">
        </div>
        <div id="titel-container">
            <div id="titel">CV Opnuuj Begoosj: Eesjte Zittesje Vaerdeins</div>
        </div>
    </header>

    <main>
        <section class="board" role="region" aria-label="Veerdèins-infoo">
            <div class="central-dashboard">

                <div class="huge-stop-container">
                    <div class="huge-label">Völgende sjtop:</div>
                    <div id="huge-wrap" class="resize-wrap">
                        <div id="huge-text" class="pop">Laje...</div>
                    </div>
                </div>

                <div class="secondary-row">

                    <div class="sub-panel left-panel">
                        <span class="arrow-icon">⬅</span>
                        <span id="prev-text" class="sec-name">—</span>
                    </div>

                    <div class="sub-panel right-panel">
                        <span id="next-text" class="sec-name">—</span>
                        <span class="arrow-icon">➡</span>
                    </div>

                </div>

            </div>
        </section>
    </main>

    <div id="bier-overlay" aria-hidden="true">
        <div class="bier-kaart">
            <div id="bier-naam-tekst">—</div>
            <div id="bier-tekst-groot">GANK BEIER HAOLE!</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=7"></script>
</body>
</html>
