<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eesjte Zittesje Vaerdeins</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>

<body class="carnaval">
    <header class="topbar">
        <img class="header-logo"
             src="{{ url_for('static', filename='cv-logo.png') }}"
             alt="Logo"
             style="height: 85%; width: auto;">

        <div id="titel">CV Opnuuj Begoosj: Eesjte Zittesje Vaerdeins</div>
    </header>

    <main>
        <section class="board" role="region" aria-label="Veerdèins-infoo">
            <div class="central-dashboard">

                <div class="huge-stop-container">
                    <div class="huge-label">Völgende sjtop:</div>
                    <div id="huge-wrap" class="resize-wrap">
                        <div id="huge-text" class="pop">Laje...</div>
                    </div>
                </div>

                <div class="secondary-row">
                    <div class="sec-stop-wrap">
                        <span class="sec-label">Veurige:</span>
                        <span id="prev-text" class="sec-name">—</span>
                    </div>

                    <div class="sec-separator">➜</div>

                    <div class="sec-stop-wrap sec-next">
                        <span class="sec-label">Hie-nao:</span>
                        <span id="next-text" class="sec-name">—</span>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <div id="bier-overlay" aria-hidden="true">
        <div class="bier-kaart">
            <div id="bier-naam-tekst">—</div>
            <div id="bier-tekst-groot">GOA BIER HAELE!</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=3"></script>
</body>
</html>
