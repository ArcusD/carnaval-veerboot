<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eesjte Zittesje Vaerdeins</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="carnaval">
    <header class="topbar">
        <div class="topbar-spacer" aria-hidden="true"></div>
        <div id="titel">Eesjte Zittesje Vaerdeins</div>
        <div id="klok" aria-label="Kloek">--:--</div>
    </header>

    <main>
        <section class="board" role="region" aria-label="Route Info">

            <div class="top-label-container">
                <div class="label" id="volgende-tekst">Völgende sjtop</div>
            </div>

            <div class="main-display" id="halte-wrap">
                <div id="huidige-halte">Laje...</div>
            </div>

            <div class="bottom-info">
                <div class="info-box prev">
                    <div class="sub-label">
                        <span class="arrow-icon">⬅</span>
                        <span>Net gewaes</span>
                    </div>
                    <div class="sub-val" id="vorige-tekst">...</div>
                </div>

                <div class="info-box next">
                    <div class="sub-label">
                        <span>Hie-nao</span>
                        <span class="arrow-icon">➜</span>
                    </div>
                    <div class="sub-val" id="daarna-tekst">...</div>
                </div>
            </div>

        </section>
    </main>

    <footer>
        <div class="footer-text">Dees veerdèins wurt aangebaoje door CV Opnuuj Begoosj</div>
        <img class="cv-logo" src="{{ url_for('static', filename='cv-logo.png') }}" alt="Logo">
    </footer>

    <div id="bier-overlay" aria-hidden="true">
        <div class="bier-kaart">
            <div id="bier-naam-tekst">—</div>
            <div id="bier-tekst-groot">GOA BIER HAELE!</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
