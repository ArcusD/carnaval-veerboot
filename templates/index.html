<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eesjte Zittesje Vaerdeins</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="carnaval">
    <header class="topbar">
        <div class="topbar-left" aria-hidden="true">🎭</div>
        <div id="titel">Eesjte Zittesje Vaerdeins</div>
        <div id="klok" aria-label="Kloek">--:--</div>
    </header>

    <main>
        <section class="board" role="region" aria-label="Veerdèins-infoo">
            <div class="board-grid">

                <!-- LINKS: HUIDIGE HALTE (PROMINENT) -->
                <div class="panel panel-current">
                    <div class="current-head">
                        <div class="label" id="volgende-tekst">Völgende sjtop</div>
                    </div>

                    <div class="current-name-wrap" id="halte-wrap" aria-label="Huidige sjtop">
                        <div id="huidige-halte">Laje...</div>
                    </div>
                </div>

                <!-- RECHTS: SJTOPPE-LIJST -->
                <aside class="panel panel-route" aria-label="Sjtoppe">
                    <div class="route-title">Sjtoppe</div>
                    <div class="route-window" id="route-window">
                        <ul id="halte-lijst" class="route-list" aria-label="Lies vaan sjtoppe"></ul>
                    </div>
                </aside>

            </div>
        </section>
    </main>

    <footer>
        Dees veerdèins wurt aangebaoje door CV Opnuuj Begoosj
    </footer>

    <!-- BIER OVERLAY -->
    <div id="bier-overlay" aria-hidden="true">
        <div class="bier-kaart">
            <div id="bier-tekst-groot">HAOL<br>BIER</div>
            <div class="bier-sub">Veur:</div>
            <div id="bier-naam-tekst">—</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
