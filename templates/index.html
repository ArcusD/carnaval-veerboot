<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eesjte Zittesje Vaerdeins</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="carnaval">
    <header class="topbar">
        <div id="titel-container">
            <img class="header-logo" src="{{ url_for('static', filename='cv-logo.jpg') }}" alt="Logo">
            <div id="titel">CV Opnuuj Begoosj: Eesjte Zittesje Vaerdeins</div>
        </div>
    </header>

    <main>
        <section class="board" role="region" aria-label="Veerdèins-infoo">
            <div class="board-grid">

                <div class="panel panel-current">
                    <div class="current-head">
                        <div class="label" id="volgende-tekst">Völgende sjtop</div>
                    </div>

                    <div class="current-name-wrap" id="halte-wrap" aria-label="Völgende sjtop">
                        <div id="huidige-halte">Laje...</div>
                    </div>
                </div>

                <aside class="panel panel-route" aria-label="Sjtoppe">
                    <div class="route-title">Sjtoppe</div>
                    <div class="route-window" id="route-window">
                        <ul id="halte-lijst" class="route-list" aria-label="Lies vaan sjtoppe"></ul>
                    </div>
                </aside>

            </div>
        </section>
    </main>

    <div id="bier-overlay" aria-hidden="true">
        <div class="bier-kaart">
            <div id="bier-naam-tekst">—</div>
            <div id="bier-tekst-groot">GOA BIER HAELE!</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
