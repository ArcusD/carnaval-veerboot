<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnaval Admin</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        .vak {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .alarm-vak {
            background: #ffe6e6;
            border: 2px solid red;
        }

        input[type="text"] {
            width: 70%;
            padding: 10px;
            font-size: 16px;
            margin-right: 5px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin: 5px 0;
        }

        .btn-groen {
            background: #28a745;
        }

        .btn-rood {
            background: #dc3545;
        }

        .btn-blauw {
            background: #007bff;
        }

        .btn-oranje {
            background: #ffc107;
            color: #000;
        }

        .btn-zwart {
            background: #333;
            width: 100%;
        }

        .btn-alarm {
            width: 100%;
            font-size: 1.2em;
            font-weight: bold;
            padding: 15px;
            margin-top: 10px;
            background: #d9534f;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>🎭 Beheer vaan de Waeg</h1>

    <div class="vak alarm-vak">
        <h2 style="color: red; margin-top: 0;">🍺 Dorsj Alarm</h2>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="bierNaam" placeholder="Wiej mot bier haole?">
        </div>
        <button class="btn-alarm" onclick="zetBierAan()">🚨 HAOL BIER!</button>
        <button class="btn-groen" onclick="zetBierUit()" style="width: 100%; margin-top: 10px;">✅ Trök nao normaal</button>
    </div>

    <div class="vak">
        <h2>📍 Roet & Sjtoppe</h2>
        <div style="display: flex;">
            <input type="text" id="nieuweHalte" placeholder="Nuije sjtop...">
            <button class="btn-groen" onclick="voegToe()">+</button>
        </div>
        <ul id="lijst"></ul>
    </div>

    <div class="vak" style="background: #e9ecef;">
        <h2>🛠️ Systeem</h2>
        <button class="btn-oranje" onclick="doeUpdate()" style="width:100%">🔄 Code opfrisse</button>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn-rood" onclick="doeReboot()" style="flex: 1;">🔌 Opnuuj starte</button>
            <button class="btn-zwart" onclick="doeShutdown()" style="flex: 1;">⚫ Oetsjakele</button>
        </div>
        <p id="status-tekst" style="text-align: center; font-style: italic; font-size: 0.9em;"></p>
    </div>

    <script>
        let haltes = [];

        async function zetBierAan() {
            const naam = document.getElementById('bierNaam').value;
            if (!naam) { alert("Vul eers eine naam in!"); return; }

            await fetch('/api/set_bier', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actief: true, naam: naam })
            });
            alert("🚨 Alarm steit aon! 't sjirm knippert noe.");
        }

        async function zetBierUit() {
            await fetch('/api/set_bier', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actief: false })
            });
            alert("✅ Alles weer normaal.");
        }

        async function laadHaltes() {
            const r = await fetch('/api/haltes'); haltes = await r.json(); tekenLijst();
        }

        function tekenLijst() {
            const l = document.getElementById('lijst'); l.innerHTML = '';
            haltes.forEach((h, i) => {
                l.innerHTML += `<li>${h} <div><button class="btn-blauw" onclick="bewerk(${i})">✏️</button> <button class="btn-rood" onclick="verwijder(${i})">X</button></div></li>`;
            });
        }

        async function opslaan() {
            await fetch('/api/haltes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(haltes) });
            tekenLijst();
        }

        function voegToe() {
            const v = document.getElementById('nieuweHalte');
            if (v.value) { haltes.push(v.value); v.value = ''; opslaan(); }
        }

        function verwijder(i) { if (confirm("Wegsmeite?")) { haltes.splice(i, 1); opslaan(); } }
        function bewerk(i) { const n = prompt("Nuije naam:", haltes[i]); if (n) { haltes[i] = n; opslaan(); } }

        async function doeUpdate() {
            document.getElementById('status-tekst').innerText = "Bezig...";
            await fetch('/api/update', { method: 'POST' });
            alert("Klaor!");
            document.getElementById('status-tekst').innerText = "";
        }
        function doeReboot() { if (confirm("Opnuuj starte?")) fetch('/api/reboot', { method: 'POST' }); }
        function doeShutdown() { if (confirm("Ech oetsjakele?")) fetch('/api/shutdown', { method: 'POST' }); }

        laadHaltes();
    </script>
</body>
</html>
